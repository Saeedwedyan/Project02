<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colors &amp; Opacity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Color Swatches</h2>
  <div class="palette">
    <div class="swatch named">Named: tomato</div>
    <div class="swatch hex">HEX: #2563eb</div>
    <div class="swatch rgb">RGB: rgb(22, 163, 74)</div>
    <div class="swatch rgba">RGBA: rgba(147, 51, 234, 0.5)</div>
  </div>

  <h2>opacity vs rgba</h2>
  <div class="backdrop">
    <div class="box opacity-box">opacity: 0.5<br>(text fades too)</div>
    <div class="box rgba-box">rgba(..., 0.5)<br>(text stays solid)</div>
  </div>
</body>
</html>
